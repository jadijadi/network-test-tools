stages:
  - build

build-hickory-dns-tests:
  stage: build
  image: rust:latest
  tags:
    - docker
  variables:
    CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  cache:
    key: hickory-dns-tests-musl
    paths:
      - .cargo/
      - hickory-dns-tests/target/
  before_script:
    - rustup target add x86_64-unknown-linux-musl
    - apt-get update -qq && apt-get install -y -qq musl-tools
  script:
    - cd hickory-dns-tests
    - cargo build --release --target x86_64-unknown-linux-musl
  artifacts:
    name: "hickory-dns-tests-${CI_COMMIT_SHORT_SHA}"
    paths:
      - hickory-dns-tests/target/x86_64-unknown-linux-musl/release/hickory-dns-tests
    expire_in: 4 weeks

build-l2-connectivity:
  stage: build
  image: golang:latest
  tags:
    - docker
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.go
    CGO_ENABLED: "0"
    GOOS: linux
    GOARCH: amd64
  cache:
    key: l2-connectivity-go
    paths:
      - .go/pkg/mod/
  script:
    - cd l2-connectivity
    - go vet ./...
    - go test ./...
    - go build -trimpath -ldflags="-s -w" -o l2-connectivity .
  artifacts:
    name: "l2-connectivity-${CI_COMMIT_SHORT_SHA}"
    paths:
      - l2-connectivity/l2-connectivity
    expire_in: 4 weeks
